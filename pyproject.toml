[project]
name = "market-intelligence-lab"
version = "0.1.0"
description = "Testable, explainable market research platform focused on evidence"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "plotly>=6.9.0",
    "streamlit>=1.61.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Plotly does not publish a py.typed marker; keep the exception scoped to that dependency.
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
